# CI for the Spring Boot web API: scan, build and test with Maven, build and push the image, then apply the stage manifests on GKE.
name: CI-backend1-stage

on:
  push:
    branches: [ "stage" ]
  pull_request:
    branches: [ "stage" ]
  workflow_dispatch:

env:
  IMAGE: nixvarghese03/coit-backend1
  GKE_CLUSTER: champion2   # cluster name
  GKE_ZONE: us-west1-a     # cluster zone

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Build and test
        working-directory: coit-backend1
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: SonarQube scan
        working-directory: coit-backend1
        env:
          SONARQUBE_PROJECT: ${{ secrets.SONARQUBE_PROJECT }}
          SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
          SONAR_TOKEN: ${{ secrets.API_KEY }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar \
            -Dsonar.projectKey=$SONARQUBE_PROJECT \
            -Dsonar.host.url=$SONARQUBE_URL \
            -Dsonar.login=$SONAR_TOKEN

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build coit-backend1 -f coit-backend1/Dockerfile-multistage -t $IMAGE:latest -t $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      # GKE_SA_KEY must hold the service account JSON key
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Apply stage manifests (cert-manager issuers and RBAC)
        run: |
          kubectl create namespace stage --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n stage -R -f backend1-kustomize-stage
