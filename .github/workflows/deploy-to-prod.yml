# CD: on a version tag (v*), build and push the web API image and apply the prod manifests on GKE.
name: CD - deploy to production

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: nixvarghese03/coit-backend1
  GKE_CLUSTER: champion2   # cluster name
  GKE_ZONE: us-west1-a     # cluster zone

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build coit-backend1 -f coit-backend1/Dockerfile-multistage -t $IMAGE:latest -t $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.ref_name }}

      # GKE_SA_KEY must hold the service account JSON key
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Apply prod manifests (cert-manager issuers and RBAC)
        run: |
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n prod -R -f backend1-kustomize-prod
